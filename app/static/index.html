<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drogo Slice</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0ebe3;
    color: #2c2420;
    min-height: 100vh;
    padding: 16px;
    overflow-y: scroll;
}

.container {
    max-width: 540px;
    margin: 0 auto;
}

header {
    display: flex;
    align-items: center;
    padding: 14px 0;
    margin-bottom: 14px;
}

header nav {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: #3b2f2f;
}

nav a {
    font-size: 0.85rem;
    color: #5a4a3a;
    text-decoration: none;
    background: #f0ebe3;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    padding: 4px 12px;
}

nav a:hover { background: #e8e0d4; }

.card {
    background: #faf7f2;
    border: 1px solid #ddd5c8;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 14px;
    text-align: center;
}

.card h2 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #3b2f2f;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd5c8;
}

.btn-group {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
}

button {
    background: #3b2f2f;
    color: #faf7f2;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

button:hover { background: #4e3e3e; }
button:active { transform: scale(0.98); }

button.secondary {
    background: transparent;
    color: #3b2f2f;
    border: 1px solid #3b2f2f;
}

button.secondary:hover { background: #f0ebe3; }

#qr-reader {
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    overflow: hidden;
    margin: 10px auto 0;
    max-width: 360px;
}

.result {
    margin-top: 12px;
    padding: 14px;
    background: #f0ebe3;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
}

.item-name {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 6px;
    color: #4a2818;
    letter-spacing: 0.015em;
}

.item-meta {
    font-size: 0.82rem;
    line-height: 1.6;
    color: #8a7b6e;
}

.status-ok { color: #4a7c3f; font-weight: 600; }
.status-low { color: #b8860b; font-weight: 600; }
.status-critical { color: #b5372a; font-weight: 600; }

.qty-controls {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
}

.bump {
    background: none;
    border: none;
    font-size: 1.8rem;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    padding: 0 6px;
    color: #3b2f2f;
}

.bump:hover { color: #6b5b4e; }

input[type=number] {
    width: 72px;
    padding: 8px;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
    text-align: center;
    background: #fff;
}

input[type=number]:focus {
    outline: none;
    border-color: #3b2f2f;
}

.placeholder {
    color: #a09585;
    font-style: italic;
    padding: 10px;
    font-size: 0.85rem;
}

.error-msg {
    color: #b5372a;
    font-weight: 600;
    padding: 6px;
}

.theme-toggle {
    background: #f0ebe3;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    min-height: auto;
    display: inline-flex;
    align-items: center;
}

.theme-toggle:hover { background: #e8e0d4; opacity: 1; }

/* Dark mode */
body.dark { background: #1a1512; color: #e0d6c8; }
body.dark header { border-color: #3b2f2f; }
body.dark h1 { color: #f0ebe3; }
body.dark nav a { color: #c4b5a4; background: #2c2420; border-color: #3b2f2f; }
body.dark nav a:hover { background: #3b2f2f; }
body.dark .card { background: #2c2420; border-color: #3b2f2f; }
body.dark .card h2 { color: #f0ebe3; border-bottom-color: #3b2f2f; }
body.dark button { background: #e8e0d4; color: #1a1512; }
body.dark button:hover { background: #f0ebe3; }
body.dark button.secondary { background: transparent; color: #e8e0d4; border-color: #e8e0d4; }
body.dark button.secondary:hover { background: #2c2420; }
body.dark .result { background: #1a1512; border-color: #3b2f2f; }
body.dark .item-name { color: #e2c4a0; }
body.dark .item-meta { color: #7a6d60; }
body.dark .bump { color: #e8e0d4; }
body.dark .bump:hover { color: #a09585; }
body.dark input[type=number] { background: #1a1512; color: #e0d6c8; border-color: #3b2f2f; }
body.dark input[type=number]:focus { border-color: #e8e0d4; }
body.dark #qr-reader { border-color: #3b2f2f; }
body.dark .placeholder { color: #6b5b4e; }
body.dark .status-ok { color: #6abf5e; }
body.dark .status-low { color: #d4a017; }
body.dark .status-critical { color: #e05545; }

/* Inventory list */
.inv-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #ddd5c8;
}
.inv-row:last-child { border-bottom: none; }

.inv-pm {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.inv-pm button {
    width: 36px;
    height: 32px;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 0;
    min-height: auto;
    border-radius: 0;
    line-height: 1;
}

.inv-pm button:first-child { border-radius: 6px 6px 0 0; }
.inv-pm button:last-child { border-radius: 0 0 6px 6px; }

.inv-info {
    flex: 1;
    text-align: left;
    min-width: 0;
}

.inv-info .item-name {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.inv-info .item-meta {
    font-size: 0.78rem;
    color: #8a7b6e;
}

body.dark .inv-row { border-bottom-color: #3b2f2f; }

.demo-scan {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
}
.demo-scan input { width: 80px; }

.tagline {
    text-align: center;
    font-size: 0.72rem;
    font-style: italic;
    color: #b8aa9a;
    letter-spacing: 0.06em;
    padding: 18px 0 8px;
}
body.dark .tagline { color: #5a4f44; }

/* Modal overlay */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
}
.modal-overlay.active { display: flex; }

.modal {
    background: #faf7f2;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    animation: modalIn 0.2s ease-out;
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
}

.modal-close {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #8a7b6e;
    min-height: auto;
    padding: 0;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
}
.modal-close:hover { color: #3b2f2f; }

.modal h2 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #3b2f2f;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd5c8;
    text-align: center;
}

body.dark .modal { background: #2c2420; }
body.dark .modal h2 { color: #f0ebe3; border-bottom-color: #3b2f2f; }
body.dark .modal-close { color: #6b5b4e; }
body.dark .modal-close:hover { color: #e8e0d4; }
</style>
</head>
<body>

<div class="container">

<header>
    <h1>Drogo Slice</h1>
    <nav>
        <a href="/manage">Manage</a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" id="themeBtn"></button>
    </nav>
</header>

<div class="card">
    <h2>Scan Item</h2>
    <div class="btn-group">
        <button id="startBtn" onclick="startScanner()">Start Scanner</button>
        <button id="stopBtn" class="secondary" onclick="stopScanner()" style="display:none;">Stop</button>
    </div>
    <div id="qr-reader"></div>
    <div class="demo-scan">
        <input type="number" id="demoId" placeholder="Item #" min="1">
        <button class="secondary" onclick="onScan(document.getElementById('demoId').value)">Simulate Scan</button>
    </div>
</div>

<div class="modal-overlay" id="scanModal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg></button>
        <h2>Last Scan</h2>
        <div id="resultContent"></div>
    </div>
</div>

<div class="card">
    <h2>Inventory</h2>
    <div id="inventoryList"></div>
</div>

<footer class="tagline">inventory at a glance</footer>

</div>

<script>
function toggleTheme() {
    const dark = document.body.classList.toggle('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = dark ? '\u2600\uFE0F' : '\uD83C\uDF19';
}

(function initTheme() {
    const saved = localStorage.getItem('theme');
    const dark = saved === 'dark';
    if (dark) document.body.classList.add('dark');
    document.getElementById('themeBtn').textContent = dark ? '\u2600\uFE0F' : '\uD83C\uDF19';
})();

let scanner = null;
let active = false;

function startScanner() {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-flex';

    scanner = new Html5Qrcode('qr-reader');
    scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScan
    ).then(() => {
        active = true;
    }).catch(() => {
        resetUI();
        showError('Camera access denied. Please allow camera permissions.');
    });
}

function stopScanner() {
    resetUI();
    if (scanner && active) {
        active = false;
        scanner.stop().then(() => scanner.clear()).catch(() => {});
    }
}

function resetUI() {
    document.getElementById('startBtn').style.display = 'inline-flex';
    document.getElementById('stopBtn').style.display = 'none';
}

async function onScan(text) {
    stopScanner();
    const id = parseInt(text);
    if (!id || id <= 0) { showError('Invalid QR code'); return; }

    try {
        const res = await fetch('/api/items/' + id);
        if (!res.ok) { showError('Item #' + id + ' not found'); return; }

        const item = await res.json();
        const ratio = item.par_level > 0 ? item.current_quantity / item.par_level : 1;

        let cls = 'status-ok', lbl = 'OK';
        if (ratio <= 0.25) { cls = 'status-critical'; lbl = 'CRITICAL'; }
        else if (ratio <= 0.5) { cls = 'status-low'; lbl = 'LOW'; }

        showItem(item, cls, lbl);
    } catch {
        showError('Network error');
    }
}

function showItem(item, cls, lbl) {
    document.getElementById('resultContent').innerHTML = `
        <div class="inv-row" style="border-bottom:none;">
            <div class="inv-pm">
                <button onclick="bump(${item.id},1,${item.current_quantity})">+</button>
                <button onclick="bump(${item.id},-1,${item.current_quantity})">−</button>
            </div>
            <div class="inv-info">
                <div class="item-name">#${item.id} — ${esc(item.name)}</div>
                <div class="item-meta">
                    <strong>${item.current_quantity}</strong> / ${item.par_level} ${esc(item.unit)}
                    &middot; <span class="${cls}">${lbl}</span>
                </div>
            </div>
        </div>
        <div class="qty-controls">
            <input type="number" id="qtyIn" value="${item.current_quantity}">
            <button onclick="setQty(${item.id})" style="min-height:38px;padding:8px 14px;">Set</button>
        </div>`;
    document.getElementById('scanModal').classList.add('active');
}

function closeModal() {
    document.getElementById('scanModal').classList.remove('active');
}

async function bump(id, delta, current) {
    await fetch('/api/items/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_quantity: Math.max(0, current + delta) })
    });
    onScan(String(id));
    loadInventory();
}

async function setQty(id) {
    const qty = parseFloat(document.getElementById('qtyIn').value);
    if (isNaN(qty) || qty < 0) { alert('Enter a valid quantity'); return; }

    await fetch('/api/items/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_quantity: qty })
    });
    onScan(String(id));
    loadInventory();
}

function showError(msg) {
    document.getElementById('resultContent').innerHTML = '<div class="error-msg">' + msg + '</div>';
    document.getElementById('scanModal').classList.add('active');
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

async function loadInventory() {
    const list = document.getElementById('inventoryList');
    try {
        const res = await fetch('/api/items/');
        const items = await res.json();
        if (!items.length) {
            list.innerHTML = '<p class="placeholder">No items yet</p>';
            return;
        }
        list.innerHTML = items.map(it => {
            const ratio = it.par_level > 0 ? it.current_quantity / it.par_level : 1;
            let cls = 'status-ok', lbl = 'OK';
            if (ratio <= 0.25) { cls = 'status-critical'; lbl = 'CRITICAL'; }
            else if (ratio <= 0.5) { cls = 'status-low'; lbl = 'LOW'; }
            return `<div class="inv-row">
                <div class="inv-pm">
                    <button onclick="invBump(${it.id},1,${it.current_quantity})">+</button>
                    <button onclick="invBump(${it.id},-1,${it.current_quantity})">−</button>
                </div>
                <div class="inv-info">
                    <div class="item-name">${esc(it.name)}</div>
                    <div class="item-meta">
                        <strong>${it.current_quantity}</strong> / ${it.par_level} ${esc(it.unit)}
                        &middot; <span class="${cls}">${lbl}</span>
                    </div>
                </div>
            </div>`;
        }).join('');
    } catch {
        list.innerHTML = '<p class="error-msg">Failed to load inventory</p>';
    }
}

async function invBump(id, delta, current) {
    await fetch('/api/items/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_quantity: Math.max(0, current + delta) })
    });
    loadInventory();
}

loadInventory();
</script>
</body>
</html>
