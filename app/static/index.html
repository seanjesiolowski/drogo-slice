
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drogo Slice</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

:root{
--cream:#f6f3eb;
--paper:#fbf8f2;
--forest:#2f4f3a;
--forest-soft:#4e6b57;
--coffee:#3b2f2f;
--line:#e4dfd4;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Inter,system-ui,sans-serif;
background:var(--cream);
color:var(--coffee);
padding:20px;
max-width:620px;
margin:auto;
}

header{
margin-bottom:18px;
}

h1{
font-family:Georgia,serif;
font-size:1.6rem;
margin-bottom:4px;
}

.subtitle{
font-size:.85rem;
color:#6a6258;
}

.section{
padding:16px 0;
border-top:1px solid var(--line);
}

.section-title{
font-size:.8rem;
letter-spacing:.08em;
text-transform:uppercase;
margin-bottom:12px;
color:#6a6258;
}

button{
background:var(--forest);
color:white;
border:1px solid var(--forest);
padding:10px 16px;
font-size:.9rem;
cursor:pointer;
border-radius:4px;
}

button.secondary{
background:transparent;
color:var(--forest);
}

button-row{
display:flex;
gap:8px;
}

#qr-reader{
border:1px solid var(--line);
border-radius:6px;
overflow:hidden;
margin-top:10px;
}

.result{
margin-top:14px;
padding:14px;
background:var(--paper);
border:1px solid var(--line);
border-radius:6px;
}

.item-name{
font-weight:600;
margin-bottom:6px;
}

.item-meta{
font-family:"JetBrains Mono", monospace;
font-size:.85rem;
line-height:1.6;
}

.status-ok{color:var(--forest);}
.status-low{color:#b07a28;}
.status-critical{color:#c33;}

.qty-controls{
display:flex;
gap:8px;
margin-top:12px;
align-items:center;
}

.bump{
width:34px;
height:34px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
border:1px solid var(--forest);
background:white;
font-weight:600;
cursor:pointer;
}

.bump.minus{
border-color:#c33;
color:#c33;
}

input[type=number]{
width:70px;
padding:6px;
border:1px solid var(--line);
border-radius:4px;
font-family:"JetBrains Mono", monospace;
}

.btn-group{
display:flex;
gap:8px;
margin-bottom:10px;
}

</style>
</head>

<body>

<header>
<h1>Drogo Slice</h1>
<div class="subtitle">inventory scanner</div>
</header>

<div class="section">

<div class="section-title">Scan Item</div>

<div class="btn-group">
<button id="qrStartBtn" onclick="startScanner()">Scan</button>
<button id="qrStopBtn" class="secondary" onclick="stopScanner()" style="display:none;">Stop</button>
</div>

<div id="qr-reader"></div>

</div>

<div class="section">

<div class="section-title">Last Scan</div>

<div id="scanResult" class="result" style="display:none;">
<div id="scanResultContent"></div>
</div>

</div>

<script>

const API_URL="";

let html5Qrcode=null;

function startScanner(){

document.getElementById("qrStartBtn").style.display="none";
document.getElementById("qrStopBtn").style.display="inline-block";

html5Qrcode=new Html5Qrcode("qr-reader");

html5Qrcode.start(
{facingMode:"environment"},
{fps:10,qrbox:{width:250,height:250}},
onScanSuccess
).catch(err=>{

stopScanner();
showError("Camera error");

});

}

function stopScanner(){

document.getElementById("qrStartBtn").style.display="inline-block";
document.getElementById("qrStopBtn").style.display="none";

if(html5Qrcode){
html5Qrcode.stop().catch(()=>{});
}

}

async function onScanSuccess(decodedText){

stopScanner();

const id=parseInt(decodedText);

if(!id){
showError("Invalid QR code");
return;
}

try{

const res=await fetch(`${API_URL}/api/items/${id}`);

if(!res.ok){
showError("Item not found");
return;
}

const item=await res.json();

let ratio=item.par_level>0?item.current_quantity/item.par_level:1;

let status="status-ok";
let label="OK";

if(ratio<=0.25){status="status-critical";label="CRITICAL"}
else if(ratio<=0.5){status="status-low";label="LOW"}

renderItem(item,status,label);

}catch(e){

showError("API error");

}

}

function renderItem(item,status,label){

const html=`
<div class="item-name">#${item.id} — ${item.name}</div>

<div class="item-meta">
qty ${item.current_quantity}/${item.par_level} ${item.unit}<br>
status <span class="${status}">${label}</span>
</div>

<div class="qty-controls">

<div class="bump minus" onclick="bump(${item.id},-1,${item.current_quantity})">−</div>
<div class="bump" onclick="bump(${item.id},1,${item.current_quantity})">+</div>

<input type="number" id="qtyInput" value="${item.current_quantity}">

<button onclick="setQty(${item.id})">set</button>

</div>
`;

document.getElementById("scanResultContent").innerHTML=html;
document.getElementById("scanResult").style.display="block";

}

async function bump(id,delta,current){

const newQty=Math.max(0,current+delta);

await fetch(`${API_URL}/api/items/${id}`,{
method:"PATCH",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({current_quantity:newQty})
});

onScanSuccess(String(id));

}

async function setQty(id){

const qty=parseFloat(document.getElementById("qtyInput").value);

await fetch(`${API_URL}/api/items/${id}`,{
method:"PATCH",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({current_quantity:qty})
});

onScanSuccess(String(id));

}

function showError(msg){

document.getElementById("scanResultContent").innerHTML="<span style='color:#c33'>"+msg+"</span>";
document.getElementById("scanResult").style.display="block";

}

</script>

</body>
</html>
