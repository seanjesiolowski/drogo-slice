<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drogo Slice</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0ebe3;
    color: #2c2420;
    min-height: 100vh;
    padding: 16px;
}

.container {
    max-width: 540px;
    margin: 0 auto;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    margin-bottom: 14px;
    background: #faf7f2;
    border: 1px solid #ddd5c8;
    border-radius: 8px;
}

h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: #3b2f2f;
}

nav a {
    font-size: 0.85rem;
    color: #5a4a3a;
    text-decoration: none;
    border-bottom: 1px solid transparent;
}

nav a:hover { border-bottom-color: #5a4a3a; }

.card {
    background: #faf7f2;
    border: 1px solid #ddd5c8;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 14px;
    text-align: center;
}

.card h2 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #3b2f2f;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd5c8;
}

.btn-group {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
}

button {
    background: #3b2f2f;
    color: #faf7f2;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

button:hover { background: #4e3e3e; }
button:active { transform: scale(0.98); }

button.secondary {
    background: transparent;
    color: #3b2f2f;
    border: 1px solid #3b2f2f;
}

button.secondary:hover { background: #f0ebe3; }

#qr-reader {
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    overflow: hidden;
    margin: 10px auto 0;
    max-width: 360px;
}

.result {
    margin-top: 12px;
    padding: 14px;
    background: #f0ebe3;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
}

.item-name {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 6px;
    color: #3b2f2f;
}

.item-meta {
    font-size: 0.85rem;
    line-height: 1.6;
    color: #6b5b4e;
}

.status-ok { color: #4a7c3f; font-weight: 600; }
.status-low { color: #b8860b; font-weight: 600; }
.status-critical { color: #b5372a; font-weight: 600; }

.qty-controls {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
}

.bump {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid #3b2f2f;
    background: #faf7f2;
    font-weight: 700;
    font-size: 1.3rem;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    user-select: none;
}

.bump:active { transform: scale(0.95); }
.bump.minus { border-color: #b5372a; color: #b5372a; }
.bump.plus { border-color: #4a7c3f; color: #4a7c3f; }

input[type=number] {
    width: 72px;
    padding: 8px;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
    text-align: center;
    background: #fff;
}

input[type=number]:focus {
    outline: none;
    border-color: #3b2f2f;
}

.placeholder {
    color: #a09585;
    font-style: italic;
    padding: 10px;
    font-size: 0.85rem;
}

.error-msg {
    color: #b5372a;
    font-weight: 600;
    padding: 6px;
}
</style>
</head>
<body>

<div class="container">

<header>
    <h1>Drogo Slice</h1>
    <nav><a href="/manage">Manage</a></nav>
</header>

<div class="card">
    <h2>Scan Item</h2>
    <div class="btn-group">
        <button id="startBtn" onclick="startScanner()">Start Scanner</button>
        <button id="stopBtn" class="secondary" onclick="stopScanner()" style="display:none;">Stop</button>
    </div>
    <div id="qr-reader"></div>
</div>

<div class="card">
    <h2>Last Scan</h2>
    <div id="scanResult" class="result" style="display:none;">
        <div id="resultContent"></div>
    </div>
    <p id="placeholder" class="placeholder">Scan a QR code to see item details</p>
</div>

</div>

<script>
let scanner = null;
let active = false;

function startScanner() {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-flex';

    scanner = new Html5Qrcode('qr-reader');
    scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScan
    ).then(() => {
        active = true;
    }).catch(() => {
        resetUI();
        showError('Camera access denied. Please allow camera permissions.');
    });
}

function stopScanner() {
    resetUI();
    if (scanner && active) {
        active = false;
        scanner.stop().then(() => scanner.clear()).catch(() => {});
    }
}

function resetUI() {
    document.getElementById('startBtn').style.display = 'inline-flex';
    document.getElementById('stopBtn').style.display = 'none';
}

async function onScan(text) {
    stopScanner();
    const id = parseInt(text);
    if (!id || id <= 0) { showError('Invalid QR code'); return; }

    try {
        const res = await fetch('/api/items/' + id);
        if (!res.ok) { showError('Item #' + id + ' not found'); return; }

        const item = await res.json();
        const ratio = item.par_level > 0 ? item.current_quantity / item.par_level : 1;

        let cls = 'status-ok', lbl = 'OK';
        if (ratio <= 0.25) { cls = 'status-critical'; lbl = 'CRITICAL'; }
        else if (ratio <= 0.5) { cls = 'status-low'; lbl = 'LOW'; }

        showItem(item, cls, lbl);
    } catch {
        showError('Network error');
    }
}

function showItem(item, cls, lbl) {
    document.getElementById('resultContent').innerHTML = `
        <div class="item-name">#${item.id} — ${esc(item.name)}</div>
        <div class="item-meta">
            <strong>${item.current_quantity}</strong> / ${item.par_level} ${esc(item.unit)}
            &middot; <span class="${cls}">${lbl}</span>
        </div>
        <div class="qty-controls">
            <div class="bump minus" onclick="bump(${item.id},-1,${item.current_quantity})">&minus;</div>
            <input type="number" id="qtyIn" value="${item.current_quantity}">
            <div class="bump plus" onclick="bump(${item.id},1,${item.current_quantity})">+</div>
            <button onclick="setQty(${item.id})" style="min-height:38px;padding:8px 14px;">Set</button>
        </div>`;
    document.getElementById('scanResult').style.display = 'block';
    document.getElementById('placeholder').style.display = 'none';
}

async function bump(id, delta, current) {
    await fetch('/api/items/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_quantity: Math.max(0, current + delta) })
    });
    onScan(String(id));
}

async function setQty(id) {
    const qty = parseFloat(document.getElementById('qtyIn').value);
    if (isNaN(qty) || qty < 0) { alert('Enter a valid quantity'); return; }

    await fetch('/api/items/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_quantity: qty })
    });
    onScan(String(id));
}

function showError(msg) {
    document.getElementById('resultContent').innerHTML = '<div class="error-msg">' + msg + '</div>';
    document.getElementById('scanResult').style.display = 'block';
    document.getElementById('placeholder').style.display = 'none';
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}
</script>
</body>
</html>
