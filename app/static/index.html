<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drogo Slice</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0ebe3;
    color: #2c2420;
    min-height: 100vh;
    padding: 16px;
    overflow-y: scroll;
}

.container {
    max-width: 540px;
    margin: 0 auto;
}

header {
    display: flex;
    align-items: center;
    padding: 14px 0;
    margin-bottom: 14px;
}

header nav {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: #3b2f2f;
}

nav a {
    font-size: 0.85rem;
    color: #5a4a3a;
    text-decoration: none;
    background: #f0ebe3;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    padding: 4px 12px;
}

nav a { transition: transform 0.1s ease, background 0.1s ease; -webkit-tap-highlight-color: transparent; }
nav a:hover { background: #e8e0d4; }
nav a:active { transform: scale(0.94); background: #ddd5c8; }

.card {
    background: #faf7f2;
    border: 1px solid #ddd5c8;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 14px;
    text-align: center;
}

.card h2 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #3b2f2f;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd5c8;
}

.card h2.toggle-heading {
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 0;
    border-bottom: none;
    padding-bottom: 0;
    transition: color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
}

.card h2.toggle-heading:hover { color: #5a4a3a; }

.toggle-chevron {
    font-style: normal;
    font-size: 0.75em;
    transition: transform 0.2s ease;
    display: inline-block;
}

.toggle-heading.open .toggle-chevron { transform: rotate(180deg); }

.inv-collapsible {
    display: none;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid #ddd5c8;
}

.inv-collapsible.open { display: block; }

.btn-group {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
}

button {
    background: #3b2f2f;
    color: #faf7f2;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

button:hover { background: #4e3e3e; }
button:active { transform: scale(0.94); background: #2a1f1f; }
button { transition: transform 0.1s ease, background 0.1s ease; -webkit-tap-highlight-color: transparent; }

button.secondary {
    background: transparent;
    color: #3b2f2f;
    border: 1px solid #3b2f2f;
}

button.secondary:hover { background: #f0ebe3; }
button.secondary:active { background: #ddd5c8; transform: scale(0.94); }

#qr-reader {
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    overflow: hidden;
    margin: 10px auto 0;
    max-width: 360px;
}

.result {
    margin-top: 12px;
    padding: 14px;
    background: #f0ebe3;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
}

.item-name {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 6px;
    color: #4a2818;
    letter-spacing: 0.015em;
}

.item-meta {
    font-size: 0.82rem;
    line-height: 1.6;
    color: #8a7b6e;
}

.status-ok { color: #4a7c3f; font-weight: 600; }
.status-low { color: #b8860b; font-weight: 600; }
.status-critical { color: #b5372a; font-weight: 600; }

.qty-controls {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
}

.bump {
    background: none;
    border: none;
    font-size: 1.8rem;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    padding: 0 6px;
    color: #3b2f2f;
}

.bump { transition: transform 0.1s ease, color 0.1s ease; -webkit-tap-highlight-color: transparent; }
.bump:hover { color: #6b5b4e; }
.bump:active { transform: scale(0.8); color: #b5372a; }

input[type=number] {
    width: 72px;
    padding: 8px;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
    text-align: center;
    background: #fff;
}

input[type=number]:focus {
    outline: none;
    border-color: #3b2f2f;
}

.placeholder {
    color: #a09585;
    font-style: italic;
    padding: 10px;
    font-size: 0.85rem;
}

.error-msg {
    color: #b5372a;
    font-weight: 600;
    padding: 6px;
}

.theme-toggle {
    background: #f0ebe3;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    min-height: auto;
    display: inline-flex;
    align-items: center;
}

.theme-toggle { transition: transform 0.1s ease; -webkit-tap-highlight-color: transparent; }
.theme-toggle:hover { background: #e8e0d4; opacity: 1; }
.theme-toggle:active { transform: scale(0.88); }

/* Dark mode */
body.dark { background: #1a1512; color: #e0d6c8; }
body.dark header { border-color: #3b2f2f; }
body.dark h1 { color: #f0ebe3; }
body.dark nav a { color: #c4b5a4; background: #2c2420; border-color: #3b2f2f; }
body.dark nav a:hover { background: #3b2f2f; }
body.dark .card { background: #2c2420; border-color: #3b2f2f; }
body.dark .card h2 { color: #f0ebe3; border-bottom-color: #3b2f2f; }
body.dark .card h2.toggle-heading:hover { color: #c4b5a4; }
body.dark .inv-collapsible { border-top-color: #3b2f2f; }
body.dark button { background: #e8e0d4; color: #1a1512; }
body.dark button:hover { background: #f0ebe3; }
body.dark button.secondary { background: transparent; color: #e8e0d4; border-color: #e8e0d4; }
body.dark button.secondary:hover { background: #2c2420; }
body.dark .result { background: #1a1512; border-color: #3b2f2f; }
body.dark .item-name { color: #e2c4a0; }
body.dark .item-meta { color: #7a6d60; }
body.dark .bump { color: #e8e0d4; }
body.dark .bump:hover { color: #a09585; }
body.dark input[type=number] { background: #1a1512; color: #e0d6c8; border-color: #3b2f2f; }
body.dark input[type=number]:focus { border-color: #e8e0d4; }
body.dark #qr-reader { border-color: #3b2f2f; }
body.dark .placeholder { color: #6b5b4e; }
body.dark .status-ok { color: #6abf5e; }
body.dark .status-low { color: #d4a017; }
body.dark .status-critical { color: #e05545; }

/* Inventory list */
.inv-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #ddd5c8;
}
.inv-row:last-child { border-bottom: none; }

.inv-pm {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.inv-pm button {
    width: 36px;
    height: 32px;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 0;
    min-height: auto;
    border-radius: 0;
    line-height: 1;
}

.inv-pm button:first-child { border-radius: 6px 6px 0 0; }
.inv-pm button:last-child { border-radius: 0 0 6px 6px; }

.inv-info {
    flex: 1;
    text-align: left;
    min-width: 0;
}

.inv-info .item-name {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.inv-info .item-meta {
    font-size: 0.78rem;
    color: #8a7b6e;
}

body.dark .inv-row { border-bottom-color: #3b2f2f; }

/* Filter bar */
.filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    align-items: center;
}

.filter-pill {
    background: transparent;
    color: #8a7b6e;
    border: 1px solid #c4b5a4;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    min-height: auto;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.1s ease;
}

.filter-pill:hover { background: #f0ebe3; border-color: #a09585; color: #5a4a3a; }
.filter-pill:active { transform: scale(0.94); }
.filter-pill.pill-active { background: #3b2f2f; color: #faf7f2; border-color: #3b2f2f; }
.filter-pill.pill-active:hover { background: #4e3e3e; }
.filter-pill.pill-low { background: #b8860b; color: #fff; border-color: #b8860b; }
.filter-pill.pill-low:hover { background: #9a7009; }
.filter-pill.pill-critical { background: #b5372a; color: #fff; border-color: #b5372a; }
.filter-pill.pill-critical:hover { background: #963025; }

.filter-select {
    flex: 1;
    min-width: 0;
    padding: 5px 28px 5px 12px;
    border: 1px solid #c4b5a4;
    border-radius: 20px;
    font-size: 0.8rem;
    font-family: inherit;
    color: #5a4a3a;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235a4a3a' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 16px;
    cursor: pointer;
}

.filter-select:focus { outline: none; border-color: #3b2f2f; }

body.dark .filter-pill { color: #6b5b4e; border-color: #4a3f35; }
body.dark .filter-pill:hover { background: #2c2420; color: #c4b5a4; border-color: #6b5b4e; }
body.dark .filter-pill.pill-active { background: #e8e0d4; color: #1a1512; border-color: #e8e0d4; }
body.dark .filter-pill.pill-active:hover { background: #f0ebe3; }
body.dark .filter-select { color: #c4b5a4; border-color: #4a3f35; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c4b5a4' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e"); }
body.dark .filter-select:focus { border-color: #e8e0d4; }

.tagline {
    text-align: center;
    font-size: 0.72rem;
    font-style: italic;
    color: #b8aa9a;
    letter-spacing: 0.06em;
    padding: 18px 0 8px;
}
body.dark .tagline { color: #5a4f44; }

/* Modal overlay */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
}
.modal-overlay.active { display: flex; }

.modal {
    background: #faf7f2;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    animation: modalIn 0.2s ease-out;
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
}

.modal-close {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #8a7b6e;
    min-height: auto;
    padding: 0;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
}
.modal-close:hover { color: #3b2f2f; }

.modal h2 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #3b2f2f;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd5c8;
    text-align: center;
}

body.dark .modal { background: #2c2420; }
body.dark .modal h2 { color: #f0ebe3; border-bottom-color: #3b2f2f; }
body.dark .modal-close { color: #6b5b4e; }
body.dark .modal-close:hover { color: #e8e0d4; }
</style>
</head>
<body>

<div class="container">

<header>
    <h1>Drogo Slice</h1>
    <nav>
        <a href="/manage">Manage</a>
        <a href="/qr">QR Codes</a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" id="themeBtn"></button>
    </nav>
</header>

<div class="card">
    <h2>Scan Item</h2>
    <div class="btn-group">
        <button id="startBtn" onclick="startScanner()">Start Scanner</button>
        <button id="stopBtn" class="secondary" onclick="stopScanner()" style="display:none;">Stop</button>
    </div>
    <div id="qr-reader"></div>
</div>

<div class="modal-overlay" id="scanModal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg></button>
        <h2>Last Scan</h2>
        <div id="resultContent"></div>
    </div>
</div>

<div class="card">
    <h2 class="toggle-heading" onclick="toggleInventory()" id="invHeading">
        All Items <span class="toggle-chevron">&#9660;</span>
    </h2>
    <div class="inv-collapsible" id="invCollapsible">
        <div class="filter-bar">
            <button class="filter-pill pill-active" id="fAll" onclick="setStockFilter('all')">All</button>
            <button class="filter-pill" id="fLow" onclick="setStockFilter('low')">Low</button>
            <button class="filter-pill" id="fCritical" onclick="setStockFilter('critical')">Critical</button>
            <select class="filter-select" id="catFilter" onchange="setCatFilter()">
                <option value="">All Categories</option>
            </select>
        </div>
        <div id="inventoryList"></div>
    </div>
</div>

<footer class="tagline">inventory at a glance</footer>

</div>

<script>
function toggleTheme() {
    const dark = document.body.classList.toggle('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = dark ? '\u2600\uFE0F' : '\uD83C\uDF19';
}

(function initTheme() {
    const saved = localStorage.getItem('theme');
    const dark = saved === 'dark';
    if (dark) document.body.classList.add('dark');
    document.getElementById('themeBtn').textContent = dark ? '\u2600\uFE0F' : '\uD83C\uDF19';
})();

let scanner = null;
let active = false;

function startScanner() {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-flex';

    scanner = new Html5Qrcode('qr-reader');
    scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScan
    ).then(() => {
        active = true;
    }).catch(() => {
        resetUI();
        showError('Camera access denied. Please allow camera permissions.');
    });
}

function stopScanner() {
    resetUI();
    if (scanner && active) {
        active = false;
        scanner.stop().then(() => scanner.clear()).catch(() => {});
    }
}

function resetUI() {
    document.getElementById('startBtn').style.display = 'inline-flex';
    document.getElementById('stopBtn').style.display = 'none';
}

function getItemStatus(item) {
    const low = 0.99;
    const crit = 0.5;
    const ratio = item.par_level > 0 ? item.current_quantity / item.par_level : 1;
    if (ratio <= crit) return { cls: 'status-critical', lbl: 'CRITICAL', status: 'critical' };
    if (ratio <= low) return { cls: 'status-low', lbl: 'LOW', status: 'low' };
    return { cls: 'status-ok', lbl: 'OK', status: 'ok' };
}

async function onScan(text) {
    stopScanner();
    const id = parseInt(text);
    if (!id || id <= 0) { showError('Invalid QR code'); return; }

    try {
        const res = await fetch('/api/items/' + id);
        if (!res.ok) { showError('Item #' + id + ' not found'); return; }

        const item = await res.json();
        const { cls, lbl } = getItemStatus(item);

        showItem(item, cls, lbl);
    } catch {
        showError('Network error');
    }
}

function showItem(item, cls, lbl) {
    document.getElementById('resultContent').innerHTML = `
        <div class="inv-row" style="border-bottom:none;">
            <div class="inv-pm">
                <button onclick="bump(${item.id},1,${item.current_quantity})">+</button>
                <button onclick="bump(${item.id},-1,${item.current_quantity})">−</button>
            </div>
            <div class="inv-info">
                <div class="item-name">#${item.id} — ${esc(item.name)}</div>
                <div class="item-meta">
                    <strong>${item.current_quantity}</strong> / ${item.par_level} ${esc(item.unit)}
                    &middot; <span class="${cls}">${lbl}</span>
                </div>
            </div>
        </div>
        <div class="qty-controls">
            <input type="number" id="qtyIn" value="${item.current_quantity}">
            <button onclick="setQty(${item.id})" style="min-height:38px;padding:8px 14px;">Set</button>
        </div>`;
    document.getElementById('scanModal').classList.add('active');
}

function closeModal() {
    document.getElementById('scanModal').classList.remove('active');
}

async function bump(id, delta, current) {
    await fetch('/api/items/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_quantity: Math.max(0, current + delta) })
    });
    onScan(String(id));
    loadInventory();
}

async function setQty(id) {
    const qty = parseFloat(document.getElementById('qtyIn').value);
    if (isNaN(qty) || qty < 0) { alert('Enter a valid quantity'); return; }

    await fetch('/api/items/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_quantity: qty })
    });
    onScan(String(id));
    loadInventory();
}

function showError(msg) {
    document.getElementById('resultContent').innerHTML = '<div class="error-msg">' + msg + '</div>';
    document.getElementById('scanModal').classList.add('active');
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

let allItems = [];
let filterLow = false;
let filterCritical = false;
let filterCategory = '';

async function loadInventory() {
    try {
        const res = await fetch('/api/items/');
        allItems = await res.json();
    } catch {
        document.getElementById('inventoryList').innerHTML = '<p class="error-msg">Failed to load inventory</p>';
        return;
    }
    populateCategoryFilter();
    renderInventory();
}

function populateCategoryFilter() {
    const seen = new Map();
    allItems.forEach(it => { if (it.category) seen.set(it.category.id, it.category.name); });
    const sel = document.getElementById('catFilter');
    sel.innerHTML = '<option value="">All Categories</option>' +
        [...seen.entries()].map(([id, name]) => `<option value="${id}">${esc(name)}</option>`).join('');
    sel.value = filterCategory;
}

function renderInventory() {
    const list = document.getElementById('inventoryList');

    let items = allItems;

    if (filterCategory) {
        items = items.filter(it => it.category && String(it.category.id) === filterCategory);
    }

    if (filterLow || filterCritical) {
        items = items.filter(it => {
            const s = getItemStatus(it);
            if (filterCritical && s.status === 'critical') return true;
            if (filterLow && s.status === 'low') return true;
            return false;
        });
    }

    if (!items.length) {
        list.innerHTML = '<p class="placeholder">No items match</p>';
        return;
    }

    list.innerHTML = items.map(it => {
        const { cls, lbl } = getItemStatus(it);
        return `<div class="inv-row">
            <div class="inv-pm">
                <button onclick="invBump(${it.id},1,${it.current_quantity})">+</button>
                <button onclick="invBump(${it.id},-1,${it.current_quantity})">−</button>
            </div>
            <div class="inv-info">
                <div class="item-name">${esc(it.name)}</div>
                <div class="item-meta">
                    <strong>${it.current_quantity}</strong> / ${it.par_level} ${esc(it.unit)}
                    &middot; <span class="${cls}">${lbl}</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

function setStockFilter(type) {
    if (type === 'all') {
        filterLow = false;
        filterCritical = false;
    } else if (type === 'low') {
        filterLow = !filterLow;
    } else if (type === 'critical') {
        filterCritical = !filterCritical;
    }
    updateFilterPills();
    renderInventory();
}

function setCatFilter() {
    filterCategory = document.getElementById('catFilter').value;
    renderInventory();
}

function updateFilterPills() {
    const allBtn = document.getElementById('fAll');
    const lowBtn = document.getElementById('fLow');
    const critBtn = document.getElementById('fCritical');
    const noneActive = !filterLow && !filterCritical;
    allBtn.className = 'filter-pill' + (noneActive ? ' pill-active' : '');
    lowBtn.className = 'filter-pill' + (filterLow ? ' pill-low' : '');
    critBtn.className = 'filter-pill' + (filterCritical ? ' pill-critical' : '');
}

async function invBump(id, delta, current) {
    await fetch('/api/items/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_quantity: Math.max(0, current + delta) })
    });
    loadInventory();
}

function toggleInventory() {
    const heading = document.getElementById('invHeading');
    const panel = document.getElementById('invCollapsible');
    const open = panel.classList.toggle('open');
    heading.classList.toggle('open', open);
}

loadInventory();
</script>
</body>
