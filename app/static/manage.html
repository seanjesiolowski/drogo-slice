<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drogo Slice - Manage</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0ebe3;
    color: #2c2420;
    min-height: 100vh;
    padding: 16px;
    overflow-y: scroll;
}

.container {
    max-width: 540px;
    margin: 0 auto;
}

header {
    display: flex;
    align-items: center;
    padding: 14px 0;
    margin-bottom: 14px;
}

header nav {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: #3b2f2f;
}

nav a {
    font-size: 0.85rem;
    color: #5a4a3a;
    text-decoration: none;
    background: #f0ebe3;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    padding: 4px 12px;
}

nav a { transition: transform 0.1s ease, background 0.1s ease; -webkit-tap-highlight-color: transparent; }
nav a:hover { background: #e8e0d4; }
nav a:active { transform: scale(0.94); background: #ddd5c8; }

.card {
    background: #faf7f2;
    border: 1px solid #ddd5c8;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 14px;
}

.card-group {
    margin-bottom: 14px;
}

.card-group .card {
    margin-bottom: 0;
}

.card-group .card:first-child {
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    border-bottom: none;
}

.card-group .card:last-child {
    border-top-left-radius: 0;
    border-top-right-radius: 0;
}

.card h2 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #3b2f2f;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd5c8;
}

.card h2.toggle-heading {
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 0;
    border-bottom: none;
    padding-bottom: 0;
    transition: color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
}

.card h2.toggle-heading:hover { color: #5a4a3a; }

.toggle-chevron {
    font-style: normal;
    font-size: 0.75em;
    transition: transform 0.2s ease;
    display: inline-block;
}

.toggle-heading.open .toggle-chevron { transform: rotate(180deg); }

.sec-collapsible {
    display: none;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid #ddd5c8;
}

.sec-collapsible.open { display: block; }

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
}

input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
    background: #fff;
}

input:focus, select:focus {
    outline: none;
    border-color: #3b2f2f;
}

select {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b2f2f' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 20px;
    padding-right: 32px;
}

button {
    background: #3b2f2f;
    color: #faf7f2;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    width: 100%;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
}

button:hover { background: #4e3e3e; }
button:active { transform: scale(0.94); background: #2a1f1f; }
button { transition: transform 0.1s ease, background 0.1s ease; -webkit-tap-highlight-color: transparent; }

.btn-sm {
    width: auto;
    min-height: 34px;
    padding: 6px 12px;
    font-size: 0.8rem;
}

.btn-outline {
    background: transparent;
    color: #3b2f2f;
    border: 1px solid #3b2f2f;
}

.btn-outline:hover { background: #f0ebe3; }
.btn-outline:active { background: #ddd5c8; transform: scale(0.94); }

.btn-danger {
    background: #b5372a;
}

.btn-danger:hover { background: #963025; }

.btn-danger-sm {
    width: auto;
    min-height: 30px;
    padding: 4px 10px;
    font-size: 0.75rem;
    background: transparent;
    color: #b5372a;
    border: 1px solid #b5372a;
}

.btn-danger-sm:hover { background: #fdf0ee; }
.btn-danger-sm:active { background: #f5d8d4; transform: scale(0.94); }

/* Item & category rows */
.entry {
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #f0ebe3;
    border-radius: 6px;
    border-left: 3px solid #3b2f2f;
}

.entry-name {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-weight: 700;
    color: #4a2818;
    font-size: 0.95rem;
    letter-spacing: 0.015em;
    margin-bottom: 4px;
    background: #e8e0d4;
    padding: 4px 8px;
    border-radius: 4px;
    display: inline-block;
}

.entry-meta {
    font-size: 0.78rem;
    color: #8a7b6e;
    line-height: 1.5;
}

.entry-controls {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
}

.bump {
    background: none;
    border: none;
    font-size: 1.4rem;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    padding: 0 6px;
    color: #3b2f2f;
}

.bump { transition: transform 0.1s ease, color 0.1s ease; -webkit-tap-highlight-color: transparent; }
.bump:hover { color: #6b5b4e; }
.bump:active { transform: scale(0.8); color: #b5372a; }

.entry-controls .spacer {
    flex: 1;
}

.edit-form {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #ddd5c8;
}

.edit-form .form-group { margin-bottom: 8px; }

.row {
    display: flex;
    gap: 8px;
}

.row > * { flex: 1; }

.status-ok { color: #4a7c3f; font-weight: 600; }
.status-low { color: #b8860b; font-weight: 600; }
.status-critical { color: #b5372a; font-weight: 600; }

.empty {
    color: #a09585;
    font-style: italic;
    text-align: center;
    padding: 16px;
    font-size: 0.85rem;
}

.theme-toggle {
    background: #f0ebe3;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    min-height: auto;
    width: auto;
}

.theme-toggle { transition: transform 0.1s ease; -webkit-tap-highlight-color: transparent; }
.theme-toggle:hover { background: #e8e0d4; opacity: 1; }
.theme-toggle:active { transform: scale(0.88); }

/* Dark mode */
body.dark { background: #1a1512; color: #e0d6c8; }
body.dark header { border-color: #3b2f2f; }
body.dark h1 { color: #f0ebe3; }
body.dark nav a { color: #c4b5a4; background: #2c2420; border-color: #3b2f2f; }
body.dark nav a:hover { background: #3b2f2f; }
body.dark .card { background: #2c2420; border-color: #3b2f2f; }
body.dark .card-group .card:first-child { border-bottom-color: transparent; }
body.dark .card h2 { color: #f0ebe3; border-bottom-color: #3b2f2f; }
body.dark .card h2.toggle-heading:hover { color: #c4b5a4; }
body.dark .sec-collapsible { border-top-color: #3b2f2f; }
body.dark button { background: #e8e0d4; color: #1a1512; }
body.dark button:hover { background: #f0ebe3; }
body.dark .btn-outline { background: transparent; color: #e8e0d4; border-color: #e8e0d4; }
body.dark .btn-outline:hover { background: #2c2420; }
body.dark .btn-danger { background: #b5372a; color: #faf7f2; }
body.dark .btn-danger:hover { background: #963025; }
body.dark .btn-danger-sm { background: transparent; color: #e05545; border-color: #e05545; }
body.dark .btn-danger-sm:hover { background: #2a1510; }
body.dark .entry { background: #1a1512; border-left-color: #e8e0d4; }
body.dark .entry-name { color: #e2c4a0; background: #3b2f2f; }
body.dark .entry-meta { color: #7a6d60; }
body.dark .bump { color: #e8e0d4; }
body.dark .bump:hover { color: #a09585; }
body.dark input, body.dark select { background-color: #1a1512; color: #e0d6c8; border-color: #3b2f2f; }
body.dark input:focus, body.dark select:focus { border-color: #e8e0d4; }
body.dark select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e8e0d4' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e"); }
body.dark .edit-form { border-top-color: #3b2f2f; }
body.dark .status-ok { color: #6abf5e; }
body.dark .status-low { color: #d4a017; }
body.dark .status-critical { color: #e05545; }
body.dark .empty { color: #6b5b4e; }

/* Filter bar */
.filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    align-items: center;
}

.filter-pill {
    background: transparent;
    color: #8a7b6e;
    border: 1px solid #c4b5a4;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    min-height: auto;
    width: auto;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.1s ease;
}

.filter-pill:hover { background: #f0ebe3; border-color: #a09585; color: #5a4a3a; }
.filter-pill:active { transform: scale(0.94); }
.filter-pill.pill-active { background: #3b2f2f; color: #faf7f2; border-color: #3b2f2f; }
.filter-pill.pill-active:hover { background: #4e3e3e; }
.filter-pill.pill-low { background: #b8860b; color: #fff; border-color: #b8860b; }
.filter-pill.pill-low:hover { background: #9a7009; }
.filter-pill.pill-critical { background: #b5372a; color: #fff; border-color: #b5372a; }
.filter-pill.pill-critical:hover { background: #963025; }

.filter-select {
    flex: 1;
    min-width: 0;
    width: auto;
    padding: 5px 28px 5px 12px;
    border: 1px solid #c4b5a4;
    border-radius: 20px;
    font-size: 0.8rem;
    font-family: inherit;
    color: #5a4a3a;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235a4a3a' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 16px;
    cursor: pointer;
}

.filter-select:focus { outline: none; border-color: #3b2f2f; }

body.dark .filter-pill { color: #6b5b4e; border-color: #4a3f35; }
body.dark .filter-pill:hover { background: #2c2420; color: #c4b5a4; border-color: #6b5b4e; }
body.dark .filter-pill.pill-active { background: #e8e0d4; color: #1a1512; border-color: #e8e0d4; }
body.dark .filter-pill.pill-active:hover { background: #f0ebe3; }
body.dark .filter-select { color: #c4b5a4; border-color: #4a3f35; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c4b5a4' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e"); }
body.dark .filter-select:focus { border-color: #e8e0d4; }

/* Modal overlay */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
}
.modal-overlay.active { display: flex; }

.modal {
    background: #faf7f2;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    animation: modalIn 0.2s ease-out;
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
}

.modal-close {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #8a7b6e;
    min-height: auto;
    padding: 0;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
}
.modal-close:hover { color: #3b2f2f; }

.modal h2 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #3b2f2f;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd5c8;
}

body.dark .modal { background: #2c2420; }
body.dark .modal h2 { color: #f0ebe3; border-bottom-color: #3b2f2f; }
body.dark .modal-close { color: #6b5b4e; }
body.dark .modal-close:hover { color: #e8e0d4; }
</style>
</head>
<body>
<div class="container">

<header>
    <h1>Drogo Slice</h1>
    <nav>
        <a href="/">Scan</a>
        <a href="/qr">QR Codes</a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" id="themeBtn"></button>
    </nav>
</header>

<div class="card-group">
<div class="card">
    <h2 class="toggle-heading" onclick="toggleSection('h-cats','p-cats')" id="h-cats">
        Categories <span class="toggle-chevron">&#9660;</span>
    </h2>
    <div class="sec-collapsible" id="p-cats">
        <div id="catList"><p class="empty">Loading...</p></div>
    </div>
</div>

<div class="card">
    <h2 class="toggle-heading" onclick="toggleSection('h-addcat','p-addcat')" id="h-addcat">
        Add Category <span class="toggle-chevron">&#9660;</span>
    </h2>
    <div class="sec-collapsible" id="p-addcat">
        <div class="form-group">
            <input type="text" id="cat-name" placeholder="Name">
        </div>
        <button onclick="createCategory()">Create</button>
    </div>
</div>
</div>

<div class="card-group">
<div class="card">
    <h2 class="toggle-heading" onclick="toggleSection('h-sc','p-sc')" id="h-sc">
        Storage Classes <span class="toggle-chevron">&#9660;</span>
    </h2>
    <div class="sec-collapsible" id="p-sc">
        <div id="scList"><p class="empty">Loading...</p></div>
    </div>
</div>

<div class="card">
    <h2 class="toggle-heading" onclick="toggleSection('h-addsc','p-addsc')" id="h-addsc">
        Add Storage Class <span class="toggle-chevron">&#9660;</span>
    </h2>
    <div class="sec-collapsible" id="p-addsc">
        <div class="form-group">
            <input type="text" id="sc-name" placeholder="Name (e.g. Refrigerated)">
        </div>
        <div class="form-group">
            <div class="row">
                <input type="number" id="sc-low" placeholder="Low threshold" min="0" max="1" step="0.01" value="0.99">
                <input type="number" id="sc-crit" placeholder="Critical threshold" min="0" max="1" step="0.01" value="0.5">
            </div>
        </div>
        <button onclick="createStorageClass()">Create</button>
    </div>
</div>
</div>

<div class="card-group">
<div class="card">
    <h2 class="toggle-heading" onclick="toggleSection('h-items','p-items')" id="h-items">
        All Items <span class="toggle-chevron">&#9660;</span>
    </h2>
    <div class="sec-collapsible" id="p-items">
        <div class="filter-bar">
            <button class="filter-pill pill-active" id="fAll" onclick="setStockFilter('all')">All</button>
            <button class="filter-pill" id="fLow" onclick="setStockFilter('low')">Low</button>
            <button class="filter-pill" id="fCritical" onclick="setStockFilter('critical')">Critical</button>
            <select class="filter-select" id="catFilter" onchange="setCatFilter()">
                <option value="">All Categories</option>
            </select>
        </div>
        <div id="itemList"><p class="empty">Loading...</p></div>
    </div>
</div>

<div class="card">
    <h2 class="toggle-heading" onclick="toggleSection('h-additem','p-additem')" id="h-additem">
        Add Item <span class="toggle-chevron">&#9660;</span>
    </h2>
    <div class="sec-collapsible" id="p-additem">
        <div class="form-group">
            <input type="number" id="item-id" placeholder="ID (blank = next)" min="1">
            <input type="text" id="item-name" placeholder="Name">
            <input type="text" id="item-unit" placeholder="Unit">
        </div>
        <div class="form-group">
            <div class="row">
                <input type="number" id="item-qty" placeholder="Actual qty" min="0">
                <input type="number" id="item-par" placeholder="Par level" min="0">
            </div>
        </div>
        <div class="form-group">
            <select id="item-cat"></select>
        </div>
        <div class="form-group">
            <select id="item-sc">
                <option value="">No Storage Class</option>
            </select>
        </div>
        <button onclick="createItem()">Create</button>
    </div>
</div>
</div>

<div class="card">
    <h2 class="toggle-heading" onclick="toggleSection('h-backup','p-backup')" id="h-backup">
        Backup <span class="toggle-chevron">&#9660;</span>
    </h2>
    <div class="sec-collapsible" id="p-backup">
        <p style="font-size:0.85rem; color:#8a7b6e; margin-bottom:12px;">Download all categories and items as a JSON file.</p>
        <button onclick="downloadBackup()">Download Backup</button>
    </div>
</div>

<div class="modal-overlay" id="editModal" onclick="if(event.target===this)closeEditModal()">
    <div class="modal">
        <button class="modal-close" onclick="closeEditModal()"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg></button>
        <h2 id="editModalTitle">Edit Item</h2>
        <div id="editModalContent"></div>
    </div>
</div>

</div>

<script>
function toggleTheme() {
    const dark = document.body.classList.toggle('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = dark ? '\u2600\uFE0F' : '\uD83C\uDF19';
}

(function initTheme() {
    const saved = localStorage.getItem('theme');
    const dark = saved === 'dark';
    if (dark) document.body.classList.add('dark');
    document.getElementById('themeBtn').textContent = dark ? '\u2600\uFE0F' : '\uD83C\uDF19';
})();

let categories = [];
let storageClasses = [];

window.addEventListener('DOMContentLoaded', () => {
    loadCategories();
    loadStorageClasses();
    loadItems();
});

// --- Categories ---

async function loadCategories() {
    try {
        const res = await fetch('/api/categories');
        categories = await res.json();
    } catch {
        categories = [];
    }

    const list = document.getElementById('catList');
    if (categories.length === 0) {
        list.innerHTML = '<p class="empty">No categories yet</p>';
    } else {
        list.innerHTML = categories.map(c => `
            <div class="entry">
                <div class="entry-name">${esc(c.name)}</div>
                <div class="entry-controls">
                    <span class="spacer"></span>
                    <button class="btn-danger-sm" onclick="deleteCategory(${c.id})">Delete</button>
                </div>
            </div>`).join('');
    }

    document.getElementById('item-cat').innerHTML =
        categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
}

async function createCategory() {
    const name = document.getElementById('cat-name').value.trim();
    if (!name) { alert('Name required'); return; }

    const res = await fetch('/api/categories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
    });

    if (res.ok) {
        document.getElementById('cat-name').value = '';
        await loadCategories();
    } else {
        const d = await res.json();
        alert(d.detail || 'Failed');
    }
}

async function deleteCategory(id) {
    if (!confirm('Delete this category?')) return;
    const res = await fetch('/api/categories/' + id, { method: 'DELETE' });
    if (res.ok) { await loadCategories(); loadItems(); }
    else { const d = await res.json(); alert(d.detail || 'Failed'); }
}

// --- Storage Classes ---

async function loadStorageClasses() {
    try {
        const res = await fetch('/api/storage-classes/');
        storageClasses = await res.json();
    } catch { storageClasses = []; }

    const list = document.getElementById('scList');
    if (storageClasses.length === 0) {
        list.innerHTML = '<p class="empty">No storage classes yet</p>';
    } else {
        list.innerHTML = storageClasses.map(sc => `
            <div class="entry">
                <div class="entry-name">${esc(sc.name)}</div>
                <div class="entry-meta">
                    Low: ${Math.round(sc.low_threshold * 100)}% &middot; Critical: ${Math.round(sc.critical_threshold * 100)}%
                </div>
                <div class="entry-controls">
                    <span class="spacer"></span>
                    <button class="btn-sm btn-outline" onclick="openEditScModal(${sc.id}, '${esc(sc.name).replace(/'/g, "\\'")}', ${sc.low_threshold}, ${sc.critical_threshold})">Edit</button>
                    <button class="btn-danger-sm" onclick="deleteStorageClass(${sc.id})">Delete</button>
                </div>
            </div>`).join('');
    }

    // Populate storage class dropdowns
    const scOpts = '<option value="">No Storage Class</option>' +
        storageClasses.map(sc => `<option value="${sc.id}">${esc(sc.name)}</option>`).join('');
    document.getElementById('item-sc').innerHTML = scOpts;
}

async function createStorageClass() {
    const name = document.getElementById('sc-name').value.trim();
    if (!name) { alert('Name required'); return; }

    const res = await fetch('/api/storage-classes/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name,
            low_threshold: parseFloat(document.getElementById('sc-low').value) || 0.99,
            critical_threshold: parseFloat(document.getElementById('sc-crit').value) || 0.5
        })
    });

    if (res.ok) {
        document.getElementById('sc-name').value = '';
        document.getElementById('sc-low').value = '0.99';
        document.getElementById('sc-crit').value = '0.5';
        await loadStorageClasses();
    } else {
        const d = await res.json();
        alert(d.detail || 'Failed');
    }
}

function openEditScModal(id, name, low, crit) {
    document.getElementById('editModalTitle').textContent = 'Edit Storage Class — ' + name;
    document.getElementById('editModalContent').innerHTML = `
        <div class="form-group">
            <input type="text" id="esn-${id}" value="${name}" placeholder="Name">
        </div>
        <div class="form-group">
            <div class="row">
                <input type="number" id="esl-${id}" value="${low}" placeholder="Low threshold" min="0" max="1" step="0.01">
                <input type="number" id="esc-${id}" value="${crit}" placeholder="Critical threshold" min="0" max="1" step="0.01">
            </div>
        </div>
        <button onclick="saveStorageClass(${id})">Save</button>`;
    document.getElementById('editModal').classList.add('active');
}

async function saveStorageClass(id) {
    const res = await fetch('/api/storage-classes/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name: document.getElementById('esn-' + id).value.trim(),
            low_threshold: parseFloat(document.getElementById('esl-' + id).value),
            critical_threshold: parseFloat(document.getElementById('esc-' + id).value)
        })
    });
    if (res.ok) { closeEditModal(); loadStorageClasses(); loadItems(); }
    else { const d = await res.json(); alert(d.detail || 'Failed'); }
}

async function deleteStorageClass(id) {
    if (!confirm('Delete this storage class?')) return;
    const res = await fetch('/api/storage-classes/' + id, { method: 'DELETE' });
    if (res.ok) { await loadStorageClasses(); loadItems(); }
    else { const d = await res.json(); alert(d.detail || 'Failed'); }
}

// --- Items ---

let allItems = [];
let filterLow = false;
let filterCritical = false;
let filterCategory = '';

async function loadItems() {
    try {
        const res = await fetch('/api/items');
        allItems = await res.json();
    } catch { allItems = []; }
    populateCategoryFilter();
    renderItems();
}

function populateCategoryFilter() {
    const seen = new Map();
    allItems.forEach(it => { if (it.category) seen.set(it.category.id, it.category.name); });
    const sel = document.getElementById('catFilter');
    sel.innerHTML = '<option value="">All Categories</option>' +
        [...seen.entries()].map(([id, name]) => `<option value="${id}">${esc(name)}</option>`).join('');
    sel.value = filterCategory;
}

function getItemStatus(item) {
    const low = item.storage_class ? item.storage_class.low_threshold : 0.99;
    const crit = item.storage_class ? item.storage_class.critical_threshold : 0.5;
    const ratio = item.par_level > 0 ? item.current_quantity / item.par_level : 1;
    if (ratio <= crit) return { cls: 'status-critical', lbl: 'CRITICAL', status: 'critical' };
    if (ratio <= low) return { cls: 'status-low', lbl: 'LOW', status: 'low' };
    return { cls: 'status-ok', lbl: 'OK', status: 'ok' };
}

function renderItems() {
    const list = document.getElementById('itemList');

    let items = allItems;

    if (filterCategory) {
        items = items.filter(it => it.category && String(it.category.id) === filterCategory);
    }

    if (filterLow || filterCritical) {
        items = items.filter(it => {
            const s = getItemStatus(it);
            if (filterCritical && s.status === 'critical') return true;
            if (filterLow && s.status === 'low') return true;
            return false;
        });
    }

    if (items.length === 0) {
        list.innerHTML = '<p class="empty">No items match</p>';
        return;
    }

    list.innerHTML = items.map(item => {
        const { cls, lbl } = getItemStatus(item);

        return `
        <div class="entry" id="row-${item.id}">
            <div class="entry-name">#${item.id} — ${esc(item.name)}</div>
            <div class="entry-meta">
                <strong>${item.current_quantity}</strong>/${item.par_level} ${esc(item.unit)}
                &middot; ${item.category ? esc(item.category.name) : 'N/A'}
                ${item.storage_class ? '&middot; ' + esc(item.storage_class.name) : ''}
                &middot; <span class="${cls}">${lbl}</span>
            </div>
            <div class="entry-controls">
                <span class="bump" onclick="bumpQty(${item.id},-1,${item.current_quantity})">-</span>
                <span class="bump" onclick="bumpQty(${item.id},1,${item.current_quantity})">+</span>
                <span class="spacer"></span>
                <button class="btn-sm btn-outline" onclick="openEditModal(${item.id}, '${esc(item.name).replace(/'/g, "\\'")}', '${esc(item.unit).replace(/'/g, "\\'")}', ${item.current_quantity}, ${item.par_level}, ${item.category_id}, ${item.storage_class_id || 'null'})">Edit</button>
            </div>
        </div>`;
    }).join('');
}

function setStockFilter(type) {
    if (type === 'all') {
        filterLow = false;
        filterCritical = false;
    } else if (type === 'low') {
        filterLow = !filterLow;
    } else if (type === 'critical') {
        filterCritical = !filterCritical;
    }
    updateFilterPills();
    renderItems();
}

function setCatFilter() {
    filterCategory = document.getElementById('catFilter').value;
    renderItems();
}

function updateFilterPills() {
    const noneActive = !filterLow && !filterCritical;
    document.getElementById('fAll').className = 'filter-pill' + (noneActive ? ' pill-active' : '');
    document.getElementById('fLow').className = 'filter-pill' + (filterLow ? ' pill-low' : '');
    document.getElementById('fCritical').className = 'filter-pill' + (filterCritical ? ' pill-critical' : '');
}

async function createItem() {
    const idVal = document.getElementById('item-id').value;
    const scVal = document.getElementById('item-sc').value;
    const payload = {
        id: idVal ? parseInt(idVal) : undefined,
        name: document.getElementById('item-name').value.trim(),
        unit: document.getElementById('item-unit').value.trim(),
        current_quantity: parseFloat(document.getElementById('item-qty').value),
        par_level: parseFloat(document.getElementById('item-par').value),
        category_id: parseInt(document.getElementById('item-cat').value),
        storage_class_id: scVal ? parseInt(scVal) : null
    };
    if (!payload.name) { alert('Name required'); return; }

    const res = await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    if (res.ok) {
        ['item-id','item-name','item-unit','item-qty','item-par'].forEach(
            id => document.getElementById(id).value = ''
        );
        loadItems();
    } else {
        const d = await res.json();
        alert(d.detail || 'Failed');
    }
}

function openEditModal(id, name, unit, qty, par, catId, scId) {
    const catOpts = categories.map(c =>
        `<option value="${c.id}" ${c.id === catId ? 'selected' : ''}>${esc(c.name)}</option>`
    ).join('');
    const scOpts = '<option value="">No Storage Class</option>' +
        storageClasses.map(sc =>
            `<option value="${sc.id}" ${sc.id === scId ? 'selected' : ''}>${esc(sc.name)}</option>`
        ).join('');

    document.getElementById('editModalTitle').textContent = 'Edit #' + id + ' — ' + name;
    document.getElementById('editModalContent').innerHTML = `
        <div class="form-group">
            <input type="text" id="en-${id}" value="${name}" placeholder="Name">
            <input type="text" id="eu-${id}" value="${unit}" placeholder="Unit">
        </div>
        <div class="form-group">
            <div class="row">
                <input type="number" id="eq-${id}" value="${qty}" placeholder="Qty" min="0">
                <input type="number" id="ep-${id}" value="${par}" placeholder="Par" min="0">
            </div>
        </div>
        <div class="form-group">
            <select id="ec-${id}">${catOpts}</select>
        </div>
        <div class="form-group">
            <select id="esc-${id}">${scOpts}</select>
        </div>
        <div class="form-group">
            <div class="row">
                <input type="number" id="ri-${id}" placeholder="New QR #" min="1">
                <button class="btn-sm btn-outline" onclick="reassign(${id})">Reassign</button>
            </div>
        </div>
        <div class="row">
            <button onclick="saveEdits(${id})">Save</button>
            <button class="btn-danger" onclick="deleteItem(${id})">Delete</button>
        </div>`;
    document.getElementById('editModal').classList.add('active');
}

function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
}

async function bumpQty(id, delta, current) {
    const res = await fetch('/api/items/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_quantity: Math.max(0, current + delta) })
    });
    if (res.ok) loadItems();
}

async function saveEdits(id) {
    const scVal = document.getElementById('esc-' + id).value;
    const res = await fetch('/api/items/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name: document.getElementById('en-' + id).value.trim(),
            unit: document.getElementById('eu-' + id).value.trim(),
            current_quantity: parseFloat(document.getElementById('eq-' + id).value),
            par_level: parseFloat(document.getElementById('ep-' + id).value),
            category_id: parseInt(document.getElementById('ec-' + id).value),
            storage_class_id: scVal ? parseInt(scVal) : null
        })
    });
    if (res.ok) { closeEditModal(); loadItems(); }
    else { const d = await res.json(); alert(d.detail || 'Failed'); }
}

async function reassign(oldId) {
    const newId = parseInt(document.getElementById('ri-' + oldId).value);
    if (isNaN(newId) || newId <= 0) { alert('Enter a valid ID'); return; }
    if (!confirm('Reassign #' + oldId + ' to #' + newId + '?')) return;

    const res = await fetch('/api/items/' + oldId + '/reassign?new_id=' + newId, { method: 'POST' });
    if (res.ok) { closeEditModal(); loadItems(); }
    else { const d = await res.json(); alert(d.detail || 'Failed'); }
}

async function deleteItem(id) {
    if (!confirm('Delete item #' + id + '?')) return;
    const res = await fetch('/api/items/' + id, { method: 'DELETE' });
    if (res.ok) { closeEditModal(); loadItems(); }
    else { const d = await res.json(); alert(d.detail || 'Failed'); }
}

async function downloadBackup() {
    try {
        const res = await fetch('/api/backup');
        if (!res.ok) { alert('Backup failed'); return; }
        const blob = await res.blob();
        const disposition = res.headers.get('Content-Disposition') || '';
        const match = disposition.match(/filename="(.+)"/);
        const filename = match ? match[1] : 'drogo-slice-backup.json';
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    } catch { alert('Backup failed — check your connection'); }
}

function toggleSection(headingId, panelId) {
    const heading = document.getElementById(headingId);
    const panel = document.getElementById(panelId);
    const open = panel.classList.toggle('open');
    heading.classList.toggle('open', open);
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}
</script>
