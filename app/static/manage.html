<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drogo Slice - Manage</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0ebe3;
    color: #2c2420;
    min-height: 100vh;
    padding: 16px;
    overflow-y: scroll;
}

.container {
    max-width: 540px;
    margin: 0 auto;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    margin-bottom: 14px;
    background: #faf7f2;
    border: 1px solid #ddd5c8;
    border-radius: 8px;
}

h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: #3b2f2f;
}

nav a {
    font-size: 0.85rem;
    color: #5a4a3a;
    text-decoration: none;
    border-bottom: 1px solid transparent;
}

nav a:hover { border-bottom-color: #5a4a3a; }

.card {
    background: #faf7f2;
    border: 1px solid #ddd5c8;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 14px;
}

.card h2 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #3b2f2f;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd5c8;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
}

input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
    background: #fff;
}

input:focus, select:focus {
    outline: none;
    border-color: #3b2f2f;
}

select {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b2f2f' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 20px;
    padding-right: 32px;
}

button {
    background: #3b2f2f;
    color: #faf7f2;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    width: 100%;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
}

button:hover { background: #4e3e3e; }
button:active { transform: scale(0.98); }

.btn-sm {
    width: auto;
    min-height: 34px;
    padding: 6px 12px;
    font-size: 0.8rem;
}

.btn-outline {
    background: transparent;
    color: #3b2f2f;
    border: 1px solid #3b2f2f;
}

.btn-outline:hover { background: #f0ebe3; }

.btn-danger {
    background: #b5372a;
}

.btn-danger:hover { background: #963025; }

.btn-danger-sm {
    width: auto;
    min-height: 30px;
    padding: 4px 10px;
    font-size: 0.75rem;
    background: transparent;
    color: #b5372a;
    border: 1px solid #b5372a;
}

.btn-danger-sm:hover { background: #fdf0ee; }

/* Item & category rows */
.entry {
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #f0ebe3;
    border-radius: 6px;
    border-left: 3px solid #3b2f2f;
}

.entry-name {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 600;
    color: #3b2f2f;
    font-size: 0.95rem;
    margin-bottom: 2px;
}

.entry-meta {
    font-size: 0.8rem;
    color: #6b5b4e;
    line-height: 1.5;
}

.entry-controls {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
}

.bump {
    background: none;
    border: none;
    font-size: 1.4rem;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    padding: 0 6px;
    color: #3b2f2f;
}

.bump:hover { color: #6b5b4e; }

.entry-controls .spacer {
    flex: 1;
}

.edit-form {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #ddd5c8;
}

.edit-form .form-group { margin-bottom: 8px; }

.row {
    display: flex;
    gap: 8px;
}

.row > * { flex: 1; }

.status-ok { color: #4a7c3f; font-weight: 600; }
.status-low { color: #b8860b; font-weight: 600; }
.status-critical { color: #b5372a; font-weight: 600; }

.empty {
    color: #a09585;
    font-style: italic;
    text-align: center;
    padding: 16px;
    font-size: 0.85rem;
}
</style>
</head>
<body>
<div class="container">

<header>
    <h1>Drogo Slice</h1>
    <nav><a href="/">Scan</a></nav>
</header>

<div class="card">
    <h2>Add Category</h2>
    <div class="form-group">
        <input type="text" id="cat-name" placeholder="Name">
        <input type="number" id="cat-order" placeholder="Display order" min="0">
    </div>
    <button onclick="createCategory()">Create</button>
</div>

<div class="card">
    <h2>Categories</h2>
    <div id="catList"><p class="empty">Loading...</p></div>
</div>

<div class="card">
    <h2>Add Item</h2>
    <div class="form-group">
        <input type="number" id="item-id" placeholder="ID (blank = next)" min="1">
        <input type="text" id="item-name" placeholder="Name">
        <input type="text" id="item-unit" placeholder="Unit">
    </div>
    <div class="form-group">
        <div class="row">
            <input type="number" id="item-qty" placeholder="Qty" min="0">
            <input type="number" id="item-par" placeholder="Par level" min="0">
        </div>
    </div>
    <div class="form-group">
        <select id="item-cat"></select>
    </div>
    <button onclick="createItem()">Create</button>
</div>

<div class="card">
    <h2>All Items</h2>
    <div id="itemList"><p class="empty">Loading...</p></div>
</div>

</div>

<script>
let categories = [];

window.addEventListener('DOMContentLoaded', () => {
    loadCategories();
    loadItems();
});

// --- Categories ---

async function loadCategories() {
    try {
        const res = await fetch('/api/categories');
        categories = await res.json();
    } catch {
        categories = [];
    }

    const list = document.getElementById('catList');
    if (categories.length === 0) {
        list.innerHTML = '<p class="empty">No categories yet</p>';
    } else {
        list.innerHTML = categories.map(c => `
            <div class="entry">
                <div class="entry-name">${esc(c.name)}</div>
                <div class="entry-controls">
                    <span class="entry-meta">Order: ${c.display_order}</span>
                    <span class="spacer"></span>
                    <button class="btn-danger-sm" onclick="deleteCategory(${c.id})">Delete</button>
                </div>
            </div>`).join('');
    }

    document.getElementById('item-cat').innerHTML =
        categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
}

async function createCategory() {
    const name = document.getElementById('cat-name').value.trim();
    const order = parseInt(document.getElementById('cat-order').value);
    if (!name) { alert('Name required'); return; }

    const res = await fetch('/api/categories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, display_order: isNaN(order) ? undefined : order })
    });

    if (res.ok) {
        document.getElementById('cat-name').value = '';
        document.getElementById('cat-order').value = '';
        loadCategories();
    } else {
        const d = await res.json();
        alert(d.detail || 'Failed');
    }
}

async function deleteCategory(id) {
    if (!confirm('Delete this category?')) return;
    const res = await fetch('/api/categories/' + id, { method: 'DELETE' });
    if (res.ok) { loadCategories(); loadItems(); }
    else { const d = await res.json(); alert(d.detail || 'Failed'); }
}

// --- Items ---

async function loadItems() {
    let items = [];
    try {
        const res = await fetch('/api/items');
        items = await res.json();
    } catch { items = []; }

    const list = document.getElementById('itemList');
    if (items.length === 0) {
        list.innerHTML = '<p class="empty">No items yet</p>';
        return;
    }

    list.innerHTML = items.map(item => {
        const ratio = item.par_level > 0 ? item.current_quantity / item.par_level : 1;
        let cls = 'status-ok', lbl = 'OK';
        if (ratio <= 0.25) { cls = 'status-critical'; lbl = 'CRITICAL'; }
        else if (ratio <= 0.5) { cls = 'status-low'; lbl = 'LOW'; }

        const catOpts = categories.map(c =>
            `<option value="${c.id}" ${c.id === item.category_id ? 'selected' : ''}>${esc(c.name)}</option>`
        ).join('');

        return `
        <div class="entry" id="row-${item.id}">
            <div class="entry-name">#${item.id} — ${esc(item.name)}</div>
            <div class="entry-meta">
                <strong>${item.current_quantity}</strong>/${item.par_level} ${esc(item.unit)}
                &middot; ${item.category ? esc(item.category.name) : 'N/A'}
                &middot; <span class="${cls}">${lbl}</span>
            </div>
            <div class="entry-controls">
                <span class="bump" onclick="bumpQty(${item.id},-1,${item.current_quantity})">-</span>
                <span class="bump" onclick="bumpQty(${item.id},1,${item.current_quantity})">+</span>
                <span class="spacer"></span>
                <button class="btn-sm btn-outline" onclick="toggleEdit(${item.id})">Edit</button>
            </div>
            <div class="edit-form" id="edit-${item.id}" style="display:none;">
                <div class="form-group">
                    <input type="text" id="en-${item.id}" value="${esc(item.name)}" placeholder="Name">
                    <input type="text" id="eu-${item.id}" value="${esc(item.unit)}" placeholder="Unit">
                </div>
                <div class="form-group">
                    <div class="row">
                        <input type="number" id="eq-${item.id}" value="${item.current_quantity}" placeholder="Qty" min="0">
                        <input type="number" id="ep-${item.id}" value="${item.par_level}" placeholder="Par" min="0">
                    </div>
                </div>
                <div class="form-group">
                    <select id="ec-${item.id}">${catOpts}</select>
                </div>
                <div class="form-group">
                    <div class="row">
                        <input type="number" id="ri-${item.id}" placeholder="New QR #" min="1">
                        <button class="btn-sm btn-outline" onclick="reassign(${item.id})">Reassign</button>
                    </div>
                </div>
                <div class="row">
                    <button onclick="saveEdits(${item.id})">Save</button>
                    <button class="btn-danger" onclick="deleteItem(${item.id})">Delete</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

async function createItem() {
    const idVal = document.getElementById('item-id').value;
    const payload = {
        id: idVal ? parseInt(idVal) : undefined,
        name: document.getElementById('item-name').value.trim(),
        unit: document.getElementById('item-unit').value.trim(),
        current_quantity: parseFloat(document.getElementById('item-qty').value),
        par_level: parseFloat(document.getElementById('item-par').value),
        category_id: parseInt(document.getElementById('item-cat').value)
    };
    if (!payload.name) { alert('Name required'); return; }

    const res = await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    if (res.ok) {
        ['item-id','item-name','item-unit','item-qty','item-par'].forEach(
            id => document.getElementById(id).value = ''
        );
        loadItems();
    } else {
        const d = await res.json();
        alert(d.detail || 'Failed');
    }
}

function toggleEdit(id) {
    const el = document.getElementById('edit-' + id);
    el.style.display = el.style.display === 'none' ? '' : 'none';
}

async function bumpQty(id, delta, current) {
    const res = await fetch('/api/items/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_quantity: Math.max(0, current + delta) })
    });
    if (res.ok) loadItems();
}

async function saveEdits(id) {
    const res = await fetch('/api/items/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name: document.getElementById('en-' + id).value.trim(),
            unit: document.getElementById('eu-' + id).value.trim(),
            current_quantity: parseFloat(document.getElementById('eq-' + id).value),
            par_level: parseFloat(document.getElementById('ep-' + id).value),
            category_id: parseInt(document.getElementById('ec-' + id).value)
        })
    });
    if (res.ok) loadItems();
    else { const d = await res.json(); alert(d.detail || 'Failed'); }
}

async function reassign(oldId) {
    const newId = parseInt(document.getElementById('ri-' + oldId).value);
    if (isNaN(newId) || newId <= 0) { alert('Enter a valid ID'); return; }
    if (!confirm('Reassign #' + oldId + ' to #' + newId + '?')) return;

    const res = await fetch('/api/items/' + oldId + '/reassign?new_id=' + newId, { method: 'POST' });
    if (res.ok) loadItems();
    else { const d = await res.json(); alert(d.detail || 'Failed'); }
}

async function deleteItem(id) {
    if (!confirm('Delete item #' + id + '?')) return;
    const res = await fetch('/api/items/' + id, { method: 'DELETE' });
    if (res.ok) loadItems();
    else { const d = await res.json(); alert(d.detail || 'Failed'); }
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}
</script>
</body>
</html>
