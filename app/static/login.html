<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in &middot; Drogo Slice</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0ebe3;
    color: #2c2420;
    min-height: 100vh;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container { max-width: 360px; width: 100%; }

h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: #3b2f2f;
    text-align: center;
    margin-bottom: 16px;
}

.card {
    background: #faf7f2;
    border: 1px solid #ddd5c8;
    border-radius: 8px;
    padding: 20px;
}

label {
    display: block;
    font-size: 0.8rem;
    color: #5a4a3a;
    margin-bottom: 5px;
}

input {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 12px;
    margin-bottom: 14px;
    background: #f0ebe3;
    color: #2c2420;
    border: 1px solid #ddd5c8;
    border-radius: 6px;
}

input:focus { outline: 2px solid #3b2f2f; outline-offset: -2px; }

button {
    width: 100%;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 11px;
    background: #3b2f2f;
    color: #f0ebe3;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.1s ease;
    -webkit-tap-highlight-color: transparent;
}

button:hover { background: #4e3e3e; }
button:active { transform: scale(0.94); background: #2a1f1f; }

.error {
    font-size: 0.85rem;
    color: #8c2f24;
    background: #f5e2df;
    border: 1px solid #e0bdb7;
    border-radius: 6px;
    padding: 9px 12px;
    margin-bottom: 14px;
}

body.dark { background: #1a1512; color: #e0d6c8; }
body.dark h1 { color: #f0ebe3; }
body.dark .card { background: #2c2420; border-color: #3b2f2f; }
body.dark label { color: #c4b5a4; }
body.dark input { background: #1a1512; color: #e0d6c8; border-color: #3b2f2f; }
body.dark button { background: #e8e0d4; color: #1a1512; }
body.dark button:hover { background: #f0ebe3; }
body.dark .error { background: #3b2020; border-color: #6b3030; color: #f0c8c2; }
</style>
</head>
<body>

<div class="container">
    <h1>Drogo Slice</h1>
    <div class="card">
        <div class="error" id="error" style="display:none;">Those credentials were not accepted.</div>
        <form method="post" action="/login" id="form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username"
                   autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit">Sign in</button>
        </form>
    </div>
</div>

<script>
(function initTheme() {
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
})();

(function initForm() {
    const params = new URLSearchParams(location.search);
    if (params.has('error')) document.getElementById('error').style.display = 'block';

    const next = params.get('next');
    if (next && next.startsWith('/') && !next.startsWith('//')) {
        document.getElementById('form').action = '/login?next=' + encodeURIComponent(next);
    }
})();
</script>

</body>
</html>
